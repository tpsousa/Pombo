services:
  postgres:
    image : postgres:16-alpine
    environment:
      POSTGRES_DB : pombo
      POSTGRES_USER : pombo
      POSTGRES_PASSWORD : ${DB_PASSWORD:-pombo-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pombo -d pombo"]
      interval: 5s
      retries : 10

    ports:
      - "5433:5432"
volumes:
  pgdata:

